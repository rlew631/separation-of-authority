name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
      - run: python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - run: python -m unittest discover -s tests -v
      - run: soa-demo
      - run: soa-experiment --trials 10 --benchmark-cases 25 --seed 20260806 --output "$RUNNER_TEMP/results-ci"
