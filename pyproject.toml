[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "separation-of-authority"
version = "0.1.0"
description = "Minimal reference implementation and controlled evaluation of separation-of-authority invariants for governed AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Allmende Labs" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rlew631/separation-of-authority"
Source = "https://github.com/rlew631/separation-of-authority"
Issues = "https://github.com/rlew631/separation-of-authority/issues"

[project.scripts]
soa-demo = "soa.demo:main"
soa-experiment = "soa.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
